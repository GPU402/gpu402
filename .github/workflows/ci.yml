name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      # Includes read-only calls to the live Lium API; no keys or funds needed.
      - run: pnpm test
      - run: pnpm --filter @gpu402/dashboard build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

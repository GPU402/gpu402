packages:
  - packages/*
  - apps/*
  - examples/*
allowBuilds:
  esbuild: true
  sharp: true
  # ssh2's native crypto helpers are optional; the pure-JS path is used.
  cpu-features: false
  ssh2: false
minimumReleaseAgeExclude:
  - '@ai-sdk/anthropic@4.0.92'
  - '@ai-sdk/gateway@4.0.130'
  - '@ai-sdk/provider-utils@5.0.71'
  - '@langchain/core@1.3.2'
  - ai@7.0.157
  - framer-motion@14.9.0
  - lucide-react@1.65.0
  - motion-dom@14.9.0
  - motion@14.9.0
  - three@0.187.0
# GHSA-mrhx-c7xc-m3w5: zod < 4.6.6 (pulled in by Remotion, dev-only) can exhaust memory.
overrides:
  zod@<4.6.6: ^4.6.7
